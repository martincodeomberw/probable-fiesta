name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint JS
        run: npm run lint:js
      - name: Lint HTML
        run: npm run lint:html
